name: Generate Lua Modules

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - Data/roles.json  # Wird nur ausgeführt, wenn sich die JSON ändert
      - .github/workflows/generate_lua.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Converter Script
        run: |
          python Scripts/json_to_lua.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Lua modules from roles.json"
          file_pattern: 'Modules/Game/KitsData/*.lua Modules/Game/KitsData_index.lua'
  
