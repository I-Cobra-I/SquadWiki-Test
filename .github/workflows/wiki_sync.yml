name: Squad Wiki Sync (Wiki.gg)

on:
  # 1. Automatischer Start bei Push von Änderungen an den Data-Dateien
  push:
    branches: [ main ]
    paths:
      - 'Data/Game_roles.json'
      - 'Data/Game_weapons.json'
      - 'Modules/Game/**'
      - '.github/workflows/wiki_sync.yml'

  # 2. Manueller Start über den "Actions"-Tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für den Sync (Zusammenfassung im Wiki)'
        required: false
        default: 'Manual Sync from GitHub'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt das Zurückschreiben generierter Lua-Dateien ins Repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Step 1: Generiere die Lua-Module aus den JSON-Dateien
      - name: Generate Lua Modules
        run: |
          python scripts/json_to_lua_roles.py
          python scripts/json_to_lua_weapons.py

      # Step 2: Commite die neu generierten Lua-Dateien zurück ins GitHub Repo (optional, aber sehr empfohlen!)
      - name: Commit generated Lua modules to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Lua modules from JSON updates"
          file_pattern: 'Modules/Game/Kits/Data/*.lua Modules/Game/Weapons/Info/*.lua Modules/Game/Kits/Data/Index.lua'

      # Step 3: Übertrag der Module nach Wiki.gg
      - name: Sync Modules to Wiki.gg
        env:
          WIKI_API: ${{ secrets.WIKI_API }}
          WIKI_USER: ${{ secrets.WIKI_USER }}
          WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
          SUMMARY: ${{ github.event.inputs.reason || 'Automated Sync via GitHub Actions' }}
        run: |
          python scripts/wiki_sync.py